# Replace IMAGE with the actual driver image before applying:
#   sed 's|IMAGE|quay.io/amorenoz/dra-driver-ovsdpdk:latest|g' \
#     deployments/openshift/webhook/deployment.yaml | kubectl apply -f -

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovsdpdk-webhook
  namespace: dra-driver-ovsdpdk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovsdpdk-webhook
  template:
    metadata:
      labels:
        app: ovsdpdk-webhook
    spec:
      serviceAccountName: ovsdpdk-webhook
      containers:
        - name: webhook
          image: IMAGE
          imagePullPolicy: Always
          command:
            - /usr/bin/webhook
            - --cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --webhook-port=9443
            - --health-probe-bind-address=:8081
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: ovsdpdk-webhook-certs
